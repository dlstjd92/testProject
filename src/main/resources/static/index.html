<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIFF 변환</title>
</head>
<body>
<div id="wrapper" style="display: flex; gap: 2em; align-items: flex-start;">
    <div id="list-section" style="flex: 1;">
        <div id="title-section" style="display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 1em;">
          <h1 style="margin: 0 0 0.5em 0;">TIFF 목록</h1>
          <div id="aws-credentials-input" style="display: flex; gap: 0.5em; align-items: center;">
            <input type="text" id="accessKeyId" placeholder="Access Key ID" style="padding: 0.5em;" />
            <input type="text" id="secretAccessKey" placeholder="Secret Access Key" style="padding: 0.5em;" />
            <button id="setCredentialsButton" style="padding: 0.5em;">AWS 키 등록</button>
          </div>
        </div>
        <button id="loadOut" style="display: none; margin-bottom: 1em;">결과 버킷 목록 불러오기</button>
        <div id="load-controls" style="display: flex; gap: 0.5em; align-items: center; margin-bottom: 1em;">
            <input type="text" id="bucket" placeholder="조회할 버킷 이름을 입력하세요" />
            <button id="load">불러오기</button>
        </div>
        <div id="actions" style="display: none; inline-flex; gap: 0.5em; margin-top: 1em; align-items: center;">
            <input type="text" id="bucketOut" placeholder="목표 버켓이름을 입력하세요" />
            <input type="text" id="targetKey" placeholder="타겟 디렉토리를 입력하세요" />
            <button id="execute">실행</button>
            <button id="toggleAll">전체 선택/해제</button>
            <span id="statusMessage" style="margin-left: 1em; font-weight: bold;"></span>
        </div>

        <div id="listContainer" style="max-height: 90vh; overflow-y: auto;"></div>
    </div>
    <div id="result-section" style="display: none; flex: 1; padding: 1em; min-height: 200px; overflow-y: auto; max-height: 90vh;">
        <h2>결과 버킷 목록</h2>
        <div id="outListContainer"></div>
    </div>
    <div id="metadata-section" style="flex: 1; padding: 1em; max-height: 90vh; overflow-y: auto;">
      <h2>메타데이터</h2>
      <div id="metadata-controls" style="display: flex; gap: 0.5em; align-items: center; margin-bottom: 1em;">
        <button id="loadMetadata">모든 메타데이터 조회</button>
        <select id="filter-column" style="margin-left: 0.5em;">
          <option value="filename">filename</option>
          <option value="width">width</option>
          <option value="height">height</option>
          <option value="bandCount">bandCount</option>
          <option value="uploadCount">uploadCount</option>
        </select>
        <input type="text" id="filter-value" placeholder="값 입력" style="margin-left: 0.5em;" />
        <button id="applyFilter" style="margin-left: 0.5em;">필터 적용</button>
      </div>
      <div id="metadataContainer"></div>
    </div>
</div>
<script>

document.getElementById('load').addEventListener('click', async () => {
    const bucketName = document.getElementById('bucket').value.trim();
    if (!bucketName) {
        alert('버킷 이름을 입력하세요');
        return;
    }
    try {
        const res = await fetch('/S3/getList', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                bucket: bucketName
            })
        });
        if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
        const list = await res.json();

        document.getElementById('result-section').style.display = 'none';
        // 렌더링
        const container = document.getElementById('listContainer');
        container.innerHTML = list.map(key =>
            `<label><input type="checkbox" class="item-checkbox" value="${key}"> ${key}</label>`
        ).join('<br>');
        document.getElementById('actions').style.display = 'block';
    } catch (err) {

    }
});
document.getElementById('execute').addEventListener('click', async () => {
    const accessKeyId = document.getElementById('accessKeyId').value.trim();
    const secretAccessKey = document.getElementById('secretAccessKey').value.trim();
    if (!accessKeyId || !secretAccessKey) {
        alert('AWS Access Key ID와 Secret Access Key를 먼저 등록해주세요.');
        document.getElementById('accessKeyId').focus();
        return;
    }

    const checked = Array.from(document.querySelectorAll('.item-checkbox:checked'))
        .map(cb => cb.value);
    if (checked.length === 0) {
        alert('하나 이상의 항목을 선택하세요');
        return;
    }
    const bucketOut = document.getElementById('bucketOut').value.trim();
    const rawTarget = document.getElementById('targetKey').value.trim();
    const targetKey = rawTarget.endsWith('/') ? rawTarget : rawTarget + '/';
    document.getElementById('statusMessage').textContent = '진행 중...';
    if (!bucketOut || !targetKey) {
        alert('버킷 아웃과 타겟 키를 모두 입력하세요');
        return;
    }
    try {
        const res = await fetch('/CogConverter/batch-convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                bucketIn: document.getElementById('bucket').value.trim(),
                keys: checked,
                bucketOut,
                targetKey
            })
        });
        if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
        await res.text();
        document.getElementById('statusMessage').textContent = '성공';
        document.getElementById('loadOut').style.display = 'block';
    } catch (err) {
        document.getElementById('statusMessage').textContent = '실패';
    }
});
const loadOutBtn = document.getElementById('loadOut');
loadOutBtn.addEventListener('click', async () => {
    const resSection = document.getElementById('result-section');
    const isVisible = resSection.style.display === 'block';
    if (isVisible) {
        resSection.style.display = 'none';
        loadOutBtn.textContent = '결과 버킷 목록 불러오기';
        return;
    }
    const bucketOut = document.getElementById('bucketOut').value.trim();
    const rawTarget = document.getElementById('targetKey').value.trim();
    const targetKey = rawTarget.endsWith('/') ? rawTarget : rawTarget + '/';
    if (!bucketOut) {
        alert('버킷 아웃을 입력하세요');
        return;
    }
    try {
        const res = await fetch('/S3/getList', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bucket: bucketOut, prefix: targetKey })
        });
        if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
        const list = await res.json();
        const outContainer = document.getElementById('outListContainer');
        outContainer.innerHTML = list.map(key => {
            const name = key.startsWith(targetKey) ? key.slice(targetKey.length) : key;
            return `<div>${name}</div>`;
        }).join('');
        resSection.style.display = 'block';
        loadOutBtn.textContent = '결과 숨기기';
    } catch (err) {
        document.getElementById('outListContainer').textContent = `에러 발생: ${err.message}`;
    }
});
document.getElementById('toggleAll').addEventListener('click', () => {
    const items = document.querySelectorAll('.item-checkbox');
    if (items.length === 0) return;
    const allChecked = Array.from(items).every(cb => cb.checked);
    items.forEach(cb => cb.checked = !allChecked);
});
</script>
<script>
document.getElementById('setCredentialsButton').addEventListener('click', async () => {
    const accessKeyId = document.getElementById('accessKeyId').value.trim();
    const secretAccessKey = document.getElementById('secretAccessKey').value.trim();
    if (!accessKeyId || !secretAccessKey) {
        alert('Access Key ID와 Secret Access Key를 모두 입력하세요.');
        return;
    }
    try {
        const res = await fetch('/aws/credentials', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessKeyId, secretAccessKey })
        });
        if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
        const message = await res.text();
        alert(message);
    } catch (err) {
        alert(`에러 발생: ${err.message}`);
    }
});
// 메타데이터 조회 기능
document.getElementById('loadMetadata').addEventListener('click', async () => {
  try {
    const res = await fetch('/metadata');
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
    const list = await res.json();
    const container = document.getElementById('metadataContainer');
    if (list.length > 0) {
      let html = '<table border="1" cellpadding="5"><thead><tr>'
        + '<th>ID</th><th>filename</th><th>width</th><th>height</th><th>bandCount</th><th>uploadCount</th>'
        + '<th>coordinateSystem</th><th>originX</th><th>originY</th>'
        + '<th>pixelSizeX</th><th>pixelSizeY</th>'
        + '<th>colorInterpretation</th><th>compression</th>'
        + '<th>lastUploadTime</th><th>createdAt</th>'
        + '</tr></thead><tbody>';
      list.forEach(item => {
        html += `<tr>
          <td>${item.id}</td>
          <td>${item.filename}</td>
          <td>${item.width}</td>
          <td>${item.height}</td>
          <td>${item.bandCount}</td>
          <td>${item.uploadCount}</td>
          <td>${item.coordinateSystem}</td>
          <td>${item.originX}</td>
          <td>${item.originY}</td>
          <td>${item.pixelSizeX}</td>
          <td>${item.pixelSizeY}</td>
          <td>${item.colorInterpretation}</td>
          <td>${item.compression}</td>
          <td>${item.lastUploadTime}</td>
          <td>${item.createdAt}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<p>메타데이터가 없습니다.</p>';
    }
  } catch (err) {
    document.getElementById('metadataContainer').textContent = `에러 발생: ${err.message}`;
  }
});

document.getElementById('applyFilter').addEventListener('click', async () => {
  const field = document.getElementById('filter-column').value;
  const value = document.getElementById('filter-value').value.trim();
  console.log('applyFilter clicked:', field, value);
  const params = new URLSearchParams();
  params.append(field, value);
  console.log('filter params:', params.toString());
  if (!value) {
    alert('필터 값을 입력하세요');
    return;
  }
  console.log('Fetching metadata with filter URL:', `/metadata/filter?${params.toString()}`);
  try {
    const res = await fetch(`/metadata/filter?${params.toString()}`);
    console.log('Response status:', res.status);
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`);
    const list = await res.json();
    const container = document.getElementById('metadataContainer');
    if (list.length > 0) {
      let html = '<table border="1" cellpadding="5"><thead><tr>'
        + '<th>ID</th><th>filename</th><th>width</th><th>height</th><th>bandCount</th><th>uploadCount</th>'
        + '<th>coordinateSystem</th><th>originX</th><th>originY</th>'
        + '<th>pixelSizeX</th><th>pixelSizeY</th>'
        + '<th>colorInterpretation</th><th>compression</th>'
        + '<th>lastUploadTime</th><th>createdAt</th>'
        + '</tr></thead><tbody>';
      list.forEach(item => {
        html += `<tr>
          <td>${item.id}</td>
          <td>${item.filename}</td>
          <td>${item.width}</td>
          <td>${item.height}</td>
          <td>${item.bandCount}</td>
          <td>${item.uploadCount}</td>
          <td>${item.coordinateSystem}</td>
          <td>${item.originX}</td>
          <td>${item.originY}</td>
          <td>${item.pixelSizeX}</td>
          <td>${item.pixelSizeY}</td>
          <td>${item.colorInterpretation}</td>
          <td>${item.compression}</td>
          <td>${item.lastUploadTime}</td>
          <td>${item.createdAt}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<p>메타데이터가 없습니다.</p>';
    }
  } catch (err) {
    document.getElementById('metadataContainer').textContent = `에러 발생: ${err.message}`;
  }
});
</script>
</body>
</html>
